name: Sync plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "37 19 * * *"
  push:
    branches: [main]
    paths:
      - "tools/sync_plugins.py"
      - ".github/workflows/sync.yml"
  pull_request:
    paths:
      - "tools/sync_plugins.py"
      - ".github/workflows/sync.yml"
      - ".github/sync-trigger"

permissions:
  contents: write

concurrency:
  group: sync-plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Mirror and rewrite dependencies
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/sync_plugins.py")
          spec = importlib.util.spec_from_file_location("sync_plugins", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          original_fetch = module.fetch
          kelee_commit = "ab6c3182fb2b09bcc34456f496282ec0b8e9217b"

          def fetch_with_fallback(url: str, attempts: int = 4) -> bytes:
              if url.startswith("https://kelee.one/"):
                  filename = url.rsplit("/", 1)[-1]
                  url = (
                      "https://raw.githubusercontent.com/mihoyo-typ/KeleeOne/"
                      f"{kelee_commit}/Script/{filename}"
                  )
              return original_fetch(url, attempts)

          module.fetch = fetch_with_fallback
          raise SystemExit(module.main())
          PY

      - name: Commit synchronized files
        run: |
          if git diff --quiet -- . ':!.github/workflows/sync.yml' && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules scripts rules MANIFEST.json SOURCES.md
          git commit -m "chore: sync upstream proxy plugins"
          git push
