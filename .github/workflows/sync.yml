name: Sync plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "37 19 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main

      - name: Mirror and rewrite dependencies
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/sync_plugins.py")
          spec = importlib.util.spec_from_file_location("sync_plugins", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          original_fetch = module.fetch
          kelee_commit = "ab6c3182fb2b09bcc34456f496282ec0b8e9217b"

          def fetch_with_fallback(url: str, attempts: int = 4) -> bytes:
              if url.startswith("https://kelee.one/"):
                  filename = url.rsplit("/", 1)[-1]
                  url = (
                      "https://raw.githubusercontent.com/mihoyo-typ/KeleeOne/"
                      f"{kelee_commit}/Script/{filename}"
                  )
              return original_fetch(url, attempts)

          module.fetch = fetch_with_fallback
          raise SystemExit(module.main())
          PY

      - name: Open or refresh review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- . && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No upstream changes"
            exit 0
          fi

          branch="automation/sync-plugins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add modules scripts rules MANIFEST.json SOURCES.md
          git commit -m "chore: sync upstream proxy plugins"
          git push --force origin "$branch"

          cat > /tmp/pr-body.md <<'EOF'
          Automated upstream plugin refresh.

          Review `MANIFEST.json`, `SOURCES.md`, module permission changes, MITM hostname changes, and JavaScript diffs before merging. The reviewed `main` branch remains unchanged until this pull request is explicitly merged.
          EOF

          pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --draft \
              --base main \
              --head "$branch" \
              --title "chore: review upstream plugin updates" \
              --body-file /tmp/pr-body.md
          else
            gh pr edit "$pr_number" \
              --title "chore: review upstream plugin updates" \
              --body-file /tmp/pr-body.md
          fi
